<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>أبو ميكو 𒉭</title>

<style>

/* =========================
   الأساس
========================= */

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;

  font-family: Arial, sans-serif;
  color: white;

  overflow-x: hidden;

  background:
    radial-gradient(
      circle at 50% 0%,
      #39e8ff55,
      transparent 30%
    ),
    radial-gradient(
      circle at 0% 80%,
      #00bcd433,
      transparent 30%
    ),
    radial-gradient(
      circle at 100% 60%,
      #ff4fb333,
      transparent 25%
    ),
    linear-gradient(
      135deg,
      #020a12,
      #062c40,
      #03131f
    );

  background-size: 160% 160%;

  animation:
    backgroundMove 15s ease-in-out infinite alternate;
}

@keyframes backgroundMove {

  from {
    background-position: 0% 0%;
  }

  to {
    background-position: 100% 100%;
  }

}


/* =========================
   خلفية الجسيمات
========================= */

.bg-symbol {

  position: fixed;

  pointer-events: none;

  z-index: 0;

  opacity: 0.35;

  user-select: none;

  animation:
    floatUp linear infinite;
}

@keyframes floatUp {

  from {
    transform:
      translateY(110vh)
      rotate(0deg);
  }

  to {
    transform:
      translateY(-15vh)
      rotate(360deg);
  }

}


/* =========================
   الوميض
========================= */

.glow {

  position: fixed;

  width: 300px;
  height: 300px;

  border-radius: 50%;

  background: #00eaff22;

  filter: blur(80px);

  pointer-events: none;

  z-index: 0;

  animation:
    glowMove 8s ease-in-out infinite alternate;
}

.glow.one {
  top: 10%;
  left: -100px;
}

.glow.two {
  bottom: 5%;
  right: -100px;
  background: #ff4fd522;
}

@keyframes glowMove {

  from {
    transform: translate(0,0);
  }

  to {
    transform: translate(80px,-50px);
  }

}


/* =========================
   الحاوية
========================= */

.container {

  position: relative;

  z-index: 2;

  width: 92%;
  max-width: 600px;

  margin: auto;

  padding:
    55px 15px 45px;

  text-align: center;
}


/* =========================
   بطاقة الملف
========================= */

.card {

  padding: 30px 20px 35px;

  border-radius: 32px;

  background:
    linear-gradient(
      145deg,
      #ffffff12,
      #ffffff05
    );

  border:
    1px solid #ffffff25;

  backdrop-filter:
    blur(18px);

  -webkit-backdrop-filter:
    blur(18px);

  box-shadow:
    0 20px 70px #00000055,
    inset 0 1px #ffffff20;
}


/* =========================
   صورة ميكو
========================= */

.profile-wrapper {

  position: relative;

  display: inline-block;

  margin-bottom: 8px;
}

.profile-wrapper::before {

  content: "🎀";

  position: absolute;

  top: -12px;
  right: -18px;

  font-size: 32px;

  z-index: 5;

  filter:
    drop-shadow(0 0 8px #00eaff);
  
  animation:
    ribbonFloat 2s ease-in-out infinite alternate;
}

@keyframes ribbonFloat {

  from {
    transform: rotate(-8deg);
  }

  to {
    transform: rotate(8deg) translateY(-5px);
  }

}

.profile {

  width: 155px;
  height: 155px;

  object-fit: cover;

  border-radius: 50%;

  border:
    4px solid white;

  box-shadow:
    0 0 20px #b9f7ff,
    0 0 50px #00d9ff88,
    0 0 90px #00d9ff33;

  animation:
    profileFloat 4s ease-in-out infinite,
    profileGlow 2.5s ease-in-out infinite alternate;
}

@keyframes profileFloat {

  0%,100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-9px);
  }

}

@keyframes profileGlow {

  from {
    box-shadow:
      0 0 15px #b9f7ff,
      0 0 40px #00d9ff66;
  }

  to {
    box-shadow:
      0 0 25px white,
      0 0 70px #00eaffaa;
  }

}


/* =========================
   الاسم
========================= */

h1 {

  margin:
    18px 0 5px;

  font-size:
    clamp(30px, 8vw, 40px);

  text-shadow:
    0 0 10px #8eefff,
    0 0 30px #00cfff,
    0 0 60px #00cfff55;
}


/* =========================
   الاسم الفرعي
========================= */

.subtitle {

  font-size: 13px;

  letter-spacing: 2px;

  color: #9defff;

  opacity: 0.8;

  margin-bottom: 12px;
}


/* =========================
   الوصف
========================= */

.bio {

  line-height: 1.8;

  font-size: 16px;

  color: #ffffffdd;

  margin-bottom: 25px;
}


/* =========================
   شريط ميكو
========================= */

.miku-tag {

  display: inline-flex;

  align-items: center;

  gap: 8px;

  padding:
    8px 16px;

  margin-bottom: 25px;

  border-radius: 50px;

  background:
    #00d9ff12;

  border:
    1px solid #00eaff55;

  box-shadow:
    0 0 20px #00d9ff22;

  font-size: 14px;
}

.miku-dot {

  width: 9px;
  height: 9px;

  border-radius: 50%;

  background: #48eaff;

  box-shadow:
    0 0 12px #00eaff;

  animation:
    dotPulse 1.5s infinite;
}

@keyframes dotPulse {

  50% {
    transform: scale(1.5);
    opacity: 0.5;
  }

}


/* =========================
   أزرار الحسابات
========================= */

.links {

  display: flex;

  flex-direction: column;

  gap: 14px;
}

.link {

  position: relative;

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 10px;

  min-height: 58px;

  padding: 15px;

  border-radius: 19px;

  color: white;

  text-decoration: none;

  font-size: 17px;

  background:
    linear-gradient(
      100deg,
      #ffffff0c,
      #ffffff18,
      #ffffff0c
    );

  border:
    1px solid #ffffff25;

  backdrop-filter:
    blur(12px);

  overflow: hidden;

  transition:
    transform 0.3s,
    border 0.3s,
    box-shadow 0.3s;
}

.link::before {

  content: "";

  position: absolute;

  width: 80px;
  height: 150%;

  top: -25%;

  left: -100px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #ffffff55,
      transparent
    );

  transform:
    rotate(20deg);

  transition:
    left 0.7s;
}

.link:hover::before {
  left: 120%;
}

.link:hover {

  transform:
    translateY(-4px)
    scale(1.015);

  border-color:
    #8eefff99;

  box-shadow:
    0 10px 35px #00d9ff33;
}

.link:active {

  transform:
    scale(0.97);
}


/* =========================
   منطقة الزينة
========================= */

.decor-title {

  margin-top: 35px;

  margin-bottom: 12px;

  font-size: 14px;

  opacity: 0.65;
}

.decorations {

  position: relative;

  height: 190px;

  margin-top: 10px;
}


/* =========================
   صور الزينة
========================= */

.decor {

  position: absolute;

  width: 82px;
  height: 82px;

  object-fit: cover;

  border-radius: 20px;

  border:
    2px solid #ffffff88;

  box-shadow:
    0 0 20px #00d9ff44;

  transition:
    0.4s;

  animation:
    decorFloat 4s ease-in-out infinite alternate;
}

.decor:hover {

  transform:
    scale(1.25)
    rotate(0deg) !important;

  z-index: 10;

  box-shadow:
    0 0 35px #00eaff99;
}

.decor1 {

  left: 4%;
  top: 15px;

  transform:
    rotate(-13deg);
}

.decor2 {

  right: 4%;
  top: 5px;

  transform:
    rotate(13deg);
}

.decor3 {

  left: 23%;
  bottom: 0;

  transform:
    rotate(8deg);
}

.decor4 {

  right: 23%;
  bottom: 8px;

  transform:
    rotate(-8deg);
}

@keyframes decorFloat {

  from {
    margin-top: 0;
  }

  to {
    margin-top: -10px;
  }

}


/* =========================
   أيقونات عائمة
========================= */

.microphone {

  position: fixed;

  right: 18px;
  bottom: 22px;

  font-size: 35px;

  filter:
    drop-shadow(0 0 12px #00eaff);

  animation:
    micFloat 3s ease-in-out infinite;

  z-index: 5;
}

@keyframes micFloat {

  0%,100% {
    transform:
      translateY(0)
      rotate(-5deg);
  }

  50% {
    transform:
      translateY(-13px)
      rotate(5deg);
  }

}

.music-note {

  position: fixed;

  left: 18px;
  bottom: 25px;

  font-size: 35px;

  color: #9defff;

  filter:
    drop-shadow(0 0 12px #00eaff);

  animation:
    noteFloat 2.5s ease-in-out infinite;

  z-index: 5;
}

@keyframes noteFloat {

  0%,100% {
    transform:
      translateY(0)
      rotate(-5deg);
  }

  50% {
    transform:
      translateY(-15px)
      rotate(5deg);
  }

}


/* =========================
   الفوتر
========================= */

.footer {

  margin-top: 30px;

  padding-top: 18px;

  border-top:
    1px solid #ffffff12;

  opacity: 0.55;

  font-size: 13px;
}


/* =========================
   الجوال
========================= */

@media (max-width: 500px) {

  .container {
    padding-top: 30px;
  }

  .card {
    padding:
      25px 14px 30px;
  }

  .profile {
    width: 135px;
    height: 135px;
  }

  .decor {
    width: 70px;
    height: 70px;
  }

  .decorations {
    height: 165px;
  }

}

</style>
</head>

<!-- =========================

<script>

const symbols = [
  "🩵",
  "🎀",
  "✨",
  "⭐",
  "♪",
  "♫",
  "♬"
];

for (let i = 0; i < 35; i++) {

  const element =
    document.createElement("div");

  element.className =
    "bg-symbol";

  element.textContent =
    symbols[
      Math.floor(
        Math.random() *
        symbols.length
      )
    ];

  element.style.left =
    Math.random() * 100 + "vw";

  element.style.fontSize =
    12 + Math.random() * 25 + "px";

  element.style.animationDuration =
    6 + Math.random() * 10 + "s";

  element.style.animationDelay =
    Math.random() * 8 + "s";

  document.body.appendChild(element);

}

</script>
