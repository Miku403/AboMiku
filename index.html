<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocaloid Snake Game</title>

    <style>
        :root {
            --primary-color: #39c5bb;
            --bg-gradient: linear-gradient(135deg, #111e2e, #1a0933);
            --card-bg: rgba(255, 255, 255, 0.08);
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(
                circle,
                rgba(57, 197, 187, 0.1) 10%,
                transparent 20%
            );
            background-size: 30px 30px;
            animation: moveBg 20s linear infinite;
        }

        @keyframes moveBg {
            from {
                background-position: 0 0;
            }

            to {
                background-position: 300px 600px;
            }
        }

        .container {
            width: 90%;
            max-width: 480px;
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        h1,
        h2 {
            margin-top: 0;
            color: var(--primary-color);
        }

        .profile-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .avatar-preview {
            font-size: 2rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 10px;
            border-radius: 50%;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            box-sizing: border-box;
        }

        .selector-group {
            margin-bottom: 12px;
            text-align: right;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 15px 0;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: var(--primary-color);
            color: #000;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .btn:hover {
            transform: scale(1.02);
            background: #4de0d5;
        }

        #game-canvas {
            background: #0d1117;
            border-radius: 8px;
            border: 2px solid var(--primary-color);
            margin-top: 10px;
            max-width: 100%;
            height: auto;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .touch-controls {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .touch-row {
            display: flex;
            gap: 10px;
        }

        .touch-btn {
            width: 50px;
            height: 50px;
            font-size: 1.2rem;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            cursor: pointer;
        }

        .touch-btn:active {
            background: var(--primary-color);
        }

        ol#leaderboard-list {
            text-align: right;
            padding-right: 20px;
        }

        ol#leaderboard-list li {
            margin-bottom: 8px;
        }

        .account-status {
            margin-top: 12px;
            font-size: 0.9rem;
            opacity: 0.85;
            min-height: 20px;
        }
    </style>
</head>

<body>

    <div class="bg-animation"></div>

    <div class="container">

        <!-- شاشة البداية -->
        <div id="start-screen" class="card">

            <h1>🐍 لعبة ثعبان Vocaloid 🎵</h1>

            <div class="profile-section">

                <div
                    class="avatar-preview"
                    id="avatar-display"
                >
                    👤
                </div>

                <input
                    type="text"
                    id="player-name"
                    placeholder="أدخل اسمك هنا..."
                    maxlength="15"
                >

            </div>

            <div class="selectors">

                <div class="selector-group">

                    <label>
                        اختر الشخصية (Skin):
                    </label>

                    <select id="skin-select">

                        <option value="miku">
                            Hatsune Miku 🟦
                        </option>

                        <option value="teto">
                            Kasane Teto 🟥
                        </option>

                        <option value="nero">
                            Nero ⬛
                        </option>

                        <option value="luka">
                            Megurine Luka 🌸
                        </option>

                        <option value="rin">
                            Kagamine Rin 🟧
                        </option>

                        <option value="yui">
                            Yui 🟪
                        </option>

                        <option
                            value="abu-miku"
                            id="secret-skin"
                            disabled
                        >
                            أبو ميكو 👑 (يتطلب 10 نقاط)
                        </option>

                    </select>

                </div>


                <div class="selector-group">

                    <label>
                        اختر الخريطة:
                    </label>

                    <select id="map-select">

                        <option value="normal">
                            عادي 🟩
                        </option>

                        <option value="desert">
                            صحراء 🏜️
                            (عكس الاتجاه + خطر 💀)
                        </option>

                        <option value="snow">
                            ثلوج ❄️
                            (تحدي حجرة ورقة مقص)
                        </option>

                    </select>

                </div>


                <div class="selector-group">

                    <label>
                        الصعوبة:
                    </label>

                    <select id="difficulty-select">

                        <option value="easy">
                            سهل 🟢
                        </option>

                        <option
                            value="medium"
                            selected
                        >
                            متوسط 🟡
                        </option>

                        <option value="hard">
                            صعب 🔴
                        </option>

                    </select>

                </div>


                <div class="checkbox-group">

                    <input
                        type="checkbox"
                        id="speedrun-mode"
                    >

                    <label for="speedrun-mode">
                        تفعيل طور السرعة (Speedrun) ⚡
                    </label>

                </div>

            </div>


            <button
                id="start-btn"
                class="btn"
            >
                ابدأ اللعب 🎮
            </button>

            <div
                id="account-status"
                class="account-status"
            ></div>

        </div>


        <!-- شاشة اللعب -->
        <div
            id="game-screen"
            class="card hidden"
        >

            <div class="game-header">

                <div>
                    النقاط:
                    <span id="score">0</span>
                </div>

                <div>
                    أعلى نتيجة:
                    <span id="high-score">0</span>
                </div>

            </div>


            <canvas
                id="game-canvas"
                width="400"
                height="400"
            ></canvas>


            <div class="touch-controls">

                <button
                    class="touch-btn"
                    id="btn-up"
                >
                    ⬆️
                </button>

                <div class="touch-row">

                    <button
                        class="touch-btn"
                        id="btn-left"
                    >
                        ⬅️
                    </button>

                    <button
                        class="touch-btn"
                        id="btn-down"
                    >
                        ⬇️
                    </button>

                    <button
                        class="touch-btn"
                        id="btn-right"
                    >
                        ➡️
                    </button>

                </div>

            </div>

        </div>


        <!-- المتصدرين -->
        <div
            id="leaderboard-card"
            class="card"
        >

            <h2>
                🏆 قائمة المتصدرين العالمية
            </h2>

            <ol id="leaderboard-list">

                <li>
                    جاري تحميل النتائج...
                </li>

            </ol>

        </div>

    </div>


    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>


    <script>
    /* =====================================================
       FIREBASE
    ===================================================== */

    const firebaseConfig = {
        apiKey: "AIzaSyDiH0kcP3ZHZRuU1jCcB_c3Zs1se_u942w",
        authDomain: "snake-vocaloid.firebaseapp.com",
        databaseURL: "https://snake-vocaloid-default-rtdb.firebaseio.com",
        projectId: "snake-vocaloid",
        storageBucket: "snake-vocaloid.firebasestorage.app",
        messagingSenderId: "704987085453",
        appId: "1:704987085453:web:5fe4666fd2191eaba280c4",
        measurementId: "G-HFJPF94XHH"
    };


    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }

    const database =
        firebase.database();


    /* =====================================================
       عناصر الواجهة
    ===================================================== */

    const startScreen =
        document.getElementById("start-screen");

    const gameScreen =
        document.getElementById("game-screen");

    const startBtn =
        document.getElementById("start-btn");

    const playerNameInput =
        document.getElementById("player-name");

    const skinSelect =
        document.getElementById("skin-select");

    const mapSelect =
        document.getElementById("map-select");

    const difficultySelect =
        document.getElementById("difficulty-select");

    const speedrunCheck =
        document.getElementById("speedrun-mode");

    const secretSkinOpt =
        document.getElementById("secret-skin");

    const scoreDisplay =
        document.getElementById("score");

    const highScoreDisplay =
        document.getElementById("high-score");

    const canvas =
        document.getElementById("game-canvas");

    const ctx =
        canvas.getContext("2d");

    const leaderboardList =
        document.getElementById("leaderboard-list");

    const accountStatus =
        document.getElementById("account-status");


    /* =====================================================
       إعدادات اللعبة
    ===================================================== */

    const gridCount = 20;

    const gridSize =
        canvas.width / gridCount;

    let snake = [];

    let food = {
        x: 0,
        y: 0
    };

    let dx = 1;
    let dy = 0;

    let score = 0;

    let highScore =
        Number(
            localStorage.getItem(
                "vocaloid_high_score"
            ) || 0
        );

    let gameInterval = null;

    let gameSpeed = 150;

    let gameRunning = false;


    /* =====================================================
       معرف الجهاز
    ===================================================== */

    function getDeviceId() {

        let deviceId =
            localStorage.getItem(
                "vocaloid_device_id"
            );

        if (!deviceId) {

            deviceId =
                "dev_" +
                Math.random()
                    .toString(36)
                    .substring(2, 12) +
                "_" +
                Date.now();

            localStorage.setItem(
                "vocaloid_device_id",
                deviceId
            );
        }

        return deviceId;
    }


    /* =====================================================
       تطبيع الاسم
    ===================================================== */

    function normalizeName(name) {

        return String(name || "")
            .trim()
            .replace(/\s+/g, " ")
            .toLowerCase();
    }


    /* =====================================================
       عرض أعلى نتيجة
    ===================================================== */

    highScoreDisplay.textContent =
        highScore;


    /* =====================================================
       ألوان السكينات
    ===================================================== */

    const skinColors = {

        "miku":
            "#39c5bb",

        "teto":
            "#ff2a6d",

        "nero":
            "#333333",

        "luka":
            "#ffb6c1",

        "rin":
            "#ffa500",

        "yui":
            "#8a2be2",

        "abu-miku":
            "#ffd700"
    };


    /* =====================================================
       السكين السري
    ===================================================== */

    function updateSecretSkin() {

        if (highScore >= 10) {

            secretSkinOpt.disabled =
                false;

            secretSkinOpt.textContent =
                "أبو ميكو 👑 (مفتوح)";

        } else {

            secretSkinOpt.disabled =
                true;

            secretSkinOpt.textContent =
                "أبو ميكو 👑 (يتطلب 10 نقاط)";
        }
    }

    updateSecretSkin();


    /* =====================================================
       استرجاع الحساب القديم
    ===================================================== */

    async function restoreOldAccount(name) {

        const safeName =
            String(name || "").trim();

        if (!safeName) {
            return 0;
        }

        const normalized =
            normalizeName(safeName);

        const snapshot =
            await database
                .ref("leaderboard")
                .once("value");

        const data =
            snapshot.val() || {};

        let highest = 0;

        let bestRecord = null;

        const oldKeys = [];


        Object.keys(data).forEach(key => {

            const item =
                data[key];

            if (!item) return;

            const itemName =
                String(
                    item.name || ""
                ).trim();

            if (!itemName) return;


            /*
                السجل القديم لا يحتوي deviceId
            */

            if (item.deviceId) {
                return;
            }


            if (
                normalizeName(itemName) ===
                normalized
            ) {

                const itemScore =
                    Number(
                        item.score || 0
                    );

                oldKeys.push(key);


                if (
                    bestRecord === null ||
                    itemScore > highest
                ) {

                    highest =
                        itemScore;

                    bestRecord = {
                        ...item
                    };
                }
            }
        });


        if (!bestRecord) {
            return 0;
        }


        /*
            نأخذ أعلى نتيجة قديمة
        */

        if (highest > highScore) {

            highScore =
                highest;

            localStorage.setItem(
                "vocaloid_high_score",
                String(highScore)
            );

            highScoreDisplay.textContent =
                highScore;
        }


        updateSecretSkin();


        /*
            ربط الحساب القديم
            بمعرف الجهاز الحالي
        */

        const deviceId =
            getDeviceId();

        const canonicalRef =
            database.ref(
                "leaderboard/" +
                deviceId
            );

        const currentSnapshot =
            await canonicalRef.once("value");

        const current =
            currentSnapshot.val();

        const currentScore =
            Number(
                current?.score || 0
            );

        const finalScore =
            Math.max(
                highest,
                currentScore
            );


        await canonicalRef.set({

            deviceId:
                deviceId,

            name:
                bestRecord.name ||
                safeName,

            score:
                finalScore,

            timestamp:
                Date.now()
        });


        /*
            حذف السجلات القديمة
            التي تم دمجها.
        */

        const updates = {};

        oldKeys.forEach(key => {

            updates[
                "leaderboard/" + key
            ] = null;

        });


        if (
            Object.keys(updates).length > 0
        ) {

            await database
                .ref()
                .update(updates);
        }


        return finalScore;
    }


    /* =====================================================
       تحميل حساب اللاعب
    ===================================================== */

    async function loadPlayerAccount() {

        const savedName =
            localStorage.getItem(
                "vocaloid_player_name"
            );


        if (savedName) {

            playerNameInput.value =
                savedName;
        }


        const deviceId =
            getDeviceId();


        const ref =
            database.ref(
                "leaderboard/" +
                deviceId
            );


        const snapshot =
            await ref.once("value");


        /*
            الحساب الحالي موجود
        */

        if (snapshot.exists()) {

            const account =
                snapshot.val();

            const cloudScore =
                Number(
                    account.score || 0
                );


            if (cloudScore > highScore) {

                highScore =
                    cloudScore;

                localStorage.setItem(
                    "vocaloid_high_score",
                    String(highScore)
                );
            }


            if (
                account.name &&
                !savedName
            ) {

                playerNameInput.value =
                    account.name;

                localStorage.setItem(
                    "vocaloid_player_name",
                    account.name
                );
            }


            highScoreDisplay.textContent =
                highScore;

            updateSecretSkin();

            accountStatus.textContent =
                "✅ تم العثور على حسابك وسكورتك القديمة";

            return;
        }


        /*
            لا يوجد حساب للجهاز.

            نحاول استرجاع الحساب القديم
            بواسطة الاسم.
        */

        if (savedName) {

            try {

                const restored =
                    await restoreOldAccount(
                        savedName
                    );


                if (restored > 0) {

                    accountStatus.textContent =
                        "🏆 تم استرجاع أعلى سكور قديم لك: " +
                        restored;

                } else {

                    accountStatus.textContent =
                        "✨ لا يوجد حساب قديم بهذا الاسم";

                }

            } catch (error) {

                console.error(
                    "تعذر استرجاع الحساب:",
                    error
                );

                accountStatus.textContent =
                    "";
            }
        }
    }


    /* =====================================================
       بداية اللعب
    ===================================================== */

    startBtn.addEventListener(
        "click",
        async () => {

            const name =
                playerNameInput.value.trim() ||
                "لاعب مجهول";


            localStorage.setItem(
                "vocaloid_player_name",
                name
            );


            /*
                نسترجع الحساب قبل بدء اللعبة
            */

            try {

                await loadPlayerAccount();

            } catch (error) {

                console.error(error);
            }


            startScreen.classList.add(
                "hidden"
            );

            gameScreen.classList.remove(
                "hidden"
            );


            initGame();
        }
    );


    /* =====================================================
       بداية الجولة
    ===================================================== */

    function initGame() {

        gameRunning = true;


        snake = [

            {
                x: 10,
                y: 10
            },

            {
                x: 9,
                y: 10
            },

            {
                x: 8,
                y: 10
            }

        ];


        dx = 1;
        dy = 0;

        score = 0;

        scoreDisplay.textContent =
            "0";


        const diff =
            difficultySelect.value;


        if (diff === "easy") {

            gameSpeed = 180;

        } else if (diff === "medium") {

            gameSpeed = 120;

        } else {

            gameSpeed = 70;
        }


        if (speedrunCheck.checked) {

            gameSpeed /=
                1.5;
        }


        spawnFood();


        if (gameInterval) {

            clearInterval(
                gameInterval
            );
        }


        gameInterval =
            setInterval(
                gameLoop,
                gameSpeed
            );


        drawGame();
    }


    /* =====================================================
       Game Loop
    ===================================================== */

    function gameLoop() {

        if (!gameRunning) {
            return;
        }


        updateSnake();


        if (checkCollision()) {

            handleGameOver();

            return;
        }


        drawGame();
    }


    /* =====================================================
       تحريك الثعبان + النقاط
    ===================================================== */

    function updateSnake() {

        const head = {

            x:
                snake[0].x + dx,

            y:
                snake[0].y + dy
        };


        snake.unshift(head);


        /*
            ⭐⭐ جمع النقاط ⭐⭐
        */

        if (
            head.x === food.x &&
            head.y === food.y
        ) {

            score++;

            scoreDisplay.textContent =
                score;


            /*
                تحديث أعلى سكور
            */

            if (score > highScore) {

                highScore =
                    score;

                highScoreDisplay.textContent =
                    highScore;


                localStorage.setItem(
                    "vocaloid_high_score",
                    String(highScore)
                );


                updateSecretSkin();
            }


            /*
                إنشاء أكل جديد
            */

            spawnFood();

        } else {

            /*
                إذا لم يأكل،
                نحذف الذيل.
            */

            snake.pop();
        }
    }


    /* =====================================================
       إنشاء الطعام
    ===================================================== */

    function spawnFood() {

        let validPosition = false;


        while (!validPosition) {

            food = {

                x:
                    Math.floor(
                        Math.random() *
                        gridCount
                    ),

                y:
                    Math.floor(
                        Math.random() *
                        gridCount
                    )
            };


            /*
                الطعام لا يظهر
                داخل الثعبان.
            */

            validPosition =
                !snake.some(
                    part =>
                        part.x === food.x &&
                        part.y === food.y
                );
        }
    }


    /* =====================================================
       التصادم
    ===================================================== */

    function checkCollision() {

        const head =
            snake[0];


        /*
            الجدران
        */

        if (
            head.x < 0 ||
            head.x >= gridCount ||
            head.y < 0 ||
            head.y >= gridCount
        ) {

            return true;
        }


        /*
            الجسم
        */

        for (
            let i = 1;
            i < snake.length;
            i++
        ) {

            if (
                head.x === snake[i].x &&
                head.y === snake[i].y
            ) {

                return true;
            }
        }


        return false;
    }


    /* =====================================================
       رسم اللعبة
    ===================================================== */

    function drawGame() {

        ctx.fillStyle =
            "#0d1117";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        /*
            الثعبان
        */

        const selectedSkin =
            skinSelect.value;


        ctx.fillStyle =
            skinColors[selectedSkin] ||
            "#39c5bb";


        snake.forEach(
            part => {

                ctx.fillRect(

                    part.x * gridSize,

                    part.y * gridSize,

                    gridSize - 1,

                    gridSize - 1

                );
            }
        );


        /*
            الطعام
        */

        ctx.fillStyle =
            "#ff0055";

        ctx.beginPath();

        ctx.arc(

            food.x * gridSize +
                gridSize / 2,

            food.y * gridSize +
                gridSize / 2,

            gridSize / 2 - 2,

            0,

            Math.PI * 2
        );

        ctx.fill();
    }


    /* =====================================================
       نهاية اللعبة
    ===================================================== */

    async function handleGameOver() {

        gameRunning = false;

        clearInterval(
            gameInterval
        );

        gameInterval = null;


        alert(
            `خسرت! مجموع نقاطك: ${score}`
        );


        const name =
            playerNameInput.value.trim() ||
            "لاعب مجهول";


        try {

            await saveScoreToFirebase(
                name,
                score
            );

        } catch (error) {

            console.error(
                "خطأ في حفظ النتيجة:",
                error
            );
        }


        gameScreen.classList.add(
            "hidden"
        );

        startScreen.classList.remove(
            "hidden"
        );
    }


    /* =====================================================
       حفظ النتيجة
    ===================================================== */

    async function saveScoreToFirebase(
        name,
        score
    ) {

        if (Number(score) <= 0) {
            return;
        }


        const deviceId =
            getDeviceId();


        const ref =
            database.ref(
                "leaderboard/" +
                deviceId
            );


        /*
            transaction:

            إذا القديم 30
            والجديد 20

            يبقى 30.

            إذا القديم 30
            والجديد 40

            يصبح 40.
        */

        await ref.transaction(
            current => {

                const oldScore =
                    Number(
                        current?.score || 0
                    );

                const newScore =
                    Number(score);


                const finalScore =
                    Math.max(
                        oldScore,
                        newScore
                    );


                return {

                    deviceId:
                        deviceId,

                    name:
                        String(
                            name ||
                            current?.name ||
                            "لاعب مجهول"
                        )
                        .trim()
                        .substring(0, 15),

                    score:
                        finalScore,

                    timestamp:
                        Date.now()
                };
            }
        );


        /*
            تحديث المحلي
        */

        if (score > highScore) {

            highScore =
                score;

            localStorage.setItem(
                "vocaloid_high_score",
                String(highScore)
            );

            highScoreDisplay.textContent =
                highScore;

            updateSecretSkin();
        }
    }


    /* =====================================================
       تنظيف تكرارات نفس الجهاز
    ===================================================== */

    async function cleanupDuplicateAccounts() {

        const snapshot =
            await database
                .ref("leaderboard")
                .once("value");


        const data =
            snapshot.val() || {};

        const groups = {};


        Object.keys(data).forEach(
            key => {

                const item =
                    data[key];

                if (!item) {
                    return;
                }


                const deviceId =
                    String(
                        item.deviceId || ""
                    ).trim();


                /*
                    السجلات القديمة
                    لا نلمسها هنا.
                */

                if (!deviceId) {
                    return;
                }


                if (!groups[deviceId]) {

                    groups[deviceId] = [];
                }


                groups[deviceId].push({

                    key:
                        key,

                    data:
                        item,

                    score:
                        Number(
                            item.score || 0
                        )
                });
            }
        );


        const updates = {};


        Object.keys(groups).forEach(
            deviceId => {

                const records =
                    groups[deviceId];


                if (records.length <= 1) {
                    return;
                }


                /*
                    الأعلى أولًا
                */

                records.sort(
                    (a, b) =>
                        b.score - a.score
                );


                const winner =
                    records[0];


                /*
                    نخلي السجل الأساسي
                    هو leaderboard/deviceId
                */

                updates[
                    "leaderboard/" +
                    deviceId
                ] = {

                    ...winner.data,

                    deviceId:
                        deviceId,

                    score:
                        winner.score
                };


                /*
                    نحذف كل التكرارات
                */

                records.forEach(
                    record => {

                        if (
                            record.key !==
                            deviceId
                        ) {

                            updates[
                                "leaderboard/" +
                                record.key
                            ] = null;
                        }
                    }
                );
            }
        );


        if (
            Object.keys(updates).length > 0
        ) {

            await database
                .ref()
                .update(updates);
        }
    }


    /* =====================================================
       تنظيف السجلات القديمة المتكررة
    ===================================================== */

    async function cleanupOldNameDuplicates() {

        const snapshot =
            await database
                .ref("leaderboard")
                .once("value");


        const data =
            snapshot.val() || {};

        const groups = {};


        Object.keys(data).forEach(
            key => {

                const item =
                    data[key];

                if (!item) {
                    return;
                }


                /*
                    فقط السجلات القديمة
                    التي لا تحتوي deviceId
                */

                if (item.deviceId) {
                    return;
                }


                const name =
                    String(
                        item.name || ""
                    ).trim();


                if (!name) {
                    return;
                }


                const normalized =
                    normalizeName(name);


                if (!groups[normalized]) {

                    groups[normalized] = [];
                }


                groups[normalized].push({

                    key:
                        key,

                    score:
                        Number(
                            item.score || 0
                        ),

                    data:
                        item
                });
            }
        );


        const updates = {};


        Object.keys(groups).forEach(
            normalized => {

                const records =
                    groups[normalized];


                if (records.length <= 1) {
                    return;
                }


                records.sort(
                    (a, b) =>
                        b.score - a.score
                );


                /*
                    نحذف كل السجلات
                    بعد الأول.

                    الأول = أعلى Score.
                */

                for (
                    let i = 1;
                    i < records.length;
                    i++
                ) {

                    updates[
                        "leaderboard/" +
                        records[i].key
                    ] = null;
                }
            }
        );


        if (
            Object.keys(updates).length > 0
        ) {

            await database
                .ref()
                .update(updates);
        }
    }


    /* =====================================================
       تحميل المتصدرين
    ===================================================== */

    function loadLeaderboard() {

        database
            .ref("leaderboard")
            .on(
                "value",
                snapshot => {

                    const data =
                        snapshot.val() || {};


                    const players = {};


                    Object.keys(data).forEach(
                        key => {

                            const item =
                                data[key];

                            if (!item) {
                                return;
                            }


                            const name =
                                String(
                                    item.name || ""
                                ).trim();


                            const itemScore =
                                Number(
                                    item.score || 0
                                );


                            if (!name) {
                                return;
                            }


                            /*
                                الحساب الجديد
                            */

                            if (item.deviceId) {

                                const id =
                                    String(
                                        item.deviceId
                                    );


                                if (
                                    !players[id] ||
                                    itemScore >
                                    Number(
                                        players[id].score || 0
                                    )
                                ) {

                                    players[id] = {

                                        name:
                                            name,

                                        score:
                                            itemScore,

                                        deviceId:
                                            id
                                    };
                                }


                            } else {

                                /*
                                    السجلات القديمة
                                */

                                const id =
                                    "old_" +
                                    normalizeName(
                                        name
                                    );


                                if (
                                    !players[id] ||
                                    itemScore >
                                    Number(
                                        players[id].score || 0
                                    )
                                ) {

                                    players[id] = {

                                        name:
                                            name,

                                        score:
                                            itemScore,

                                        deviceId:
                                            null
                                    };
                                }
                            }
                        }
                    );


                    const scores =
                        Object.values(
                            players
                        );


                    /*
                        الأعلى أولًا
                    */

                    scores.sort(
                        (a, b) =>
                            Number(b.score) -
                            Number(a.score)
                    );


                    leaderboardList.innerHTML =
                        "";


                    if (
                        scores.length === 0
                    ) {

                        const li =
                            document.createElement(
                                "li"
                            );

                        li.textContent =
                            "لا توجد نتائج بعد.";

                        leaderboardList
                            .appendChild(li);

                        return;
                    }


                    scores
                        .slice(0, 10)
                        .forEach(
                            (item, index) => {

                                const li =
                                    document.createElement(
                                        "li"
                                    );


                                let medal = "";


                                if (
                                    index === 0
                                ) {
                                    medal =
                                        "🥇 ";
                                }

                                else if (
                                    index === 1
                                ) {
                                    medal =
                                        "🥈 ";
                                }

                                else if (
                                    index === 2
                                ) {
                                    medal =
                                        "🥉 ";
                                }


                                li.textContent =
                                    `${medal}${item.name}: ${item.score} نقطة`;


                                leaderboardList
                                    .appendChild(li);
                            }
                        );
                }
            );
    }


    /* =====================================================
       لوحة المفاتيح
    ===================================================== */

    document.addEventListener(
        "keydown",
        e => {

            const isDesert =
                mapSelect.value ===
                "desert";


            if (
                e.key === "ArrowUp" ||
                e.key === "w"
            ) {

                if (
                    isDesert
                        ? dy !== -1
                        : dy !== 1
                ) {

                    dx = 0;

                    dy =
                        isDesert
                            ? 1
                            : -1;
                }
            }


            else if (
                e.key === "ArrowDown" ||
                e.key === "s"
            ) {

                if (
                    isDesert
                        ? dy !== 1
                        : dy !== -1
                ) {

                    dx = 0;

                    dy =
                        isDesert
                            ? -1
                            : 1;
                }
            }


            else if (
                e.key === "ArrowLeft" ||
                e.key === "a"
            ) {

                if (
                    isDesert
                        ? dx !== -1
                        : dx !== 1
                ) {

                    dx =
                        isDesert
                            ? 1
                            : -1;

                    dy = 0;
                }
            }


            else if (
                e.key === "ArrowRight" ||
                e.key === "d"
            ) {

                if (
                    isDesert
                        ? dx !== 1
                        : dx !== -1
                ) {

                    dx =
                        isDesert
                            ? -1
                            : 1;

                    dy = 0;
                }
            }
        }
    );


    /* =====================================================
       أزرار الجوال
    ===================================================== */

    document.getElementById(
        "btn-up"
    ).onclick = () => {

        if (dy !== 1) {

            dx = 0;
            dy = -1;
        }
    };


    document.getElementById(
        "btn-down"
    ).onclick = () => {

        if (dy !== -1) {

            dx = 0;
            dy = 1;
        }
    };


    document.getElementById(
        "btn-left"
    ).onclick = () => {

        if (dx !== 1) {

            dx = -1;
            dy = 0;
        }
    };


    document.getElementById(
        "btn-right"
    ).onclick = () => {

        if (dx !== -1) {

            dx = 1;
            dy = 0;
        }
    };


    /* =====================================================
       التهيئة
    ===================================================== */

    async function initialize() {

        try {

            /*
                أولًا نسترجع الحساب القديم
                أو الحساب الحالي.
            */

            await loadPlayerAccount();


            /*
                ثم ننظف التكرارات.
            */

            await cleanupOldNameDuplicates();

            await cleanupDuplicateAccounts();


        } catch (error) {

            console.error(
                "خطأ أثناء التهيئة:",
                error
            );
        }


        /*
            بعدها نراقب المتصدرين.
        */

        loadLeaderboard();
    }


    initialize();

    </script>
